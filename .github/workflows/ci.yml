name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 (Sequoia) instead of macos-latest: the latter migrated to
        # macOS 26 (Tahoe) whose SDK dropped the AGL framework that Qt6's
        # prebuilt binaries still reference at link time. The resulting binary
        # still runs on macOS 26.x.
        os: [ubuntu-latest, windows-latest, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      # Tên file chạy lấy thẳng từ project(...) trong CMakeLists.txt, để dùng
      # bộ code này làm gốc cho dự án khác thì không phải sửa cả workflow.
      - name: Read app name
        id: app
        shell: bash
        run: sed -n 's/^project(\([A-Za-z0-9_-]*\).*/name=\1/p' CMakeLists.txt >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.app.outputs.name }}-${{ matrix.os }}
          path: |
            build/**/${{ steps.app.outputs.name }}
            build/**/${{ steps.app.outputs.name }}.exe
            build/**/${{ steps.app.outputs.name }}.app
          if-no-files-found: ignore
