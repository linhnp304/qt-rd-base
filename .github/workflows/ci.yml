name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 (Sequoia) instead of macos-latest: the latter migrated to
        # macOS 26 (Tahoe) whose SDK dropped the AGL framework that Qt6's
        # prebuilt binaries still reference at link time. The resulting binary
        # still runs on macOS 26.x.
        os: [ubuntu-latest, windows-latest, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cross_p1-${{ matrix.os }}
          path: |
            build/**/cross_p1
            build/**/cross_p1.exe
            build/**/cross_p1.app
          if-no-files-found: ignore
